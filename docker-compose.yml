# RiskShield AI — Docker Compose
# ---------------------------------------------------------------------------
# Quick start:
#   docker compose up -d db        # start just Postgres for local `npm run dev`
#   docker compose up --build      # build and run the whole app in containers
#
# The `db` service alone is usually the most useful one during development —
# it saves you from installing Postgres yourself. Point DATABASE_URL in your
# .env at it (the default in .env.example already matches).
# ---------------------------------------------------------------------------
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: riskshield
    ports:
      - "5432:5432"
    volumes:
      - riskshield_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/riskshield?schema=public"
      AUTH_SECRET: "${AUTH_SECRET:-change-this-to-a-long-random-string}"
      AI_PROVIDER: "${AI_PROVIDER:-none}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-}"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    ports:
      - "3000:3000"

volumes:
  riskshield_pgdata:
